{
  "id": "melee-mechanical-effect-vocabulary-v0.1",
  "status": "GOVERNING PROVISIONAL RULES-LANGUAGE SPECIFICATION FOR THE CURRENT LONGSWORD VERTICAL SLICE",
  "version": "0.1",
  "adjudicated_on": "2026-08-13",
  "scope": "Finite mechanical grammar for current longsword Basics, governing provisional Plays, incomplete material, and one candidate-only diagnostic.",
  "not_a_balance_formula": true,
  "principles": [
    "Triggers are not effects.",
    "Costs and commitments are not effects.",
    "Historical description alone is not a gameplay effect.",
    "Principal payload and physical/state aftermath are recorded separately.",
    "Changed fields are not automatically equal-price effects.",
    "Displacement is event metadata unless another rule consumes it or derives a consequence from it.",
    "Open is a guard-state value; Strip Guard is the operation that sets guard to Open.",
    "Contact and measure are independent axes.",
    "Establish Crossing and Retain Crossing are distinct operations.",
    "Generic Control is forbidden and must be decomposed."
  ],
  "low_level_operators": [
    {
      "id": "ATTACK",
      "meaning": "Resolve one weapon attack using the specified existing attack procedure and modifiers.",
      "ordinary_primary_payload": true
    },
    {
      "id": "CANCEL",
      "meaning": "The referenced pending attack does not resolve.",
      "ordinary_primary_payload": true
    },
    {
      "id": "SET",
      "meaning": "Assign an approved state axis an explicit approved value.",
      "ordinary_primary_payload": false
    },
    {
      "id": "CLEAR",
      "meaning": "Return an approved nullable state axis to its defined empty/default value without changing independent axes.",
      "ordinary_primary_payload": false
    },
    {
      "id": "RETAIN",
      "meaning": "Suppress the named state's normal cleanup for the specified bounded window; it does not establish a state that is absent.",
      "ordinary_primary_payload": false
    },
    {
      "id": "MODIFY_ATTACK",
      "meaning": "Apply an approved accuracy, damage, timing, or commitment parameter to ATTACK; it does not create a second attack.",
      "ordinary_primary_payload": false
    },
    {
      "id": "REPLACE_PENDING_ATTACK",
      "meaning": "Replace the currently pending attack resolution with one newly rolled attack object; the original pending attack and declared defence roll do not also resolve.",
      "ordinary_primary_payload": false,
      "exceptional": true,
      "required_by": ["Durchwechseln D1"],
      "why_required": "CANCEL plus ATTACK would obscure that D1 substitutes one attack resolution for another rather than creating a second independent attack."
    },
    {
      "id": "RESTRICT_RESPONSE",
      "meaning": "Remove or narrow an otherwise legal response or response step.",
      "ordinary_primary_payload": false,
      "exceptional": true
    }
  ],
  "primary_payload_vocabulary": [
    {
      "id": "MAKE_ATTACK",
      "operator": "ATTACK",
      "definition": "Resolve one weapon attack using the specified normal attack procedure unless explicitly modified.",
      "parameters": ["attack_kind", "test_skill", "accuracy_modifier", "damage_mode", "damage_modifier", "timing", "target"]
    },
    {
      "id": "CANCEL_ATTACK",
      "operator": "CANCEL",
      "definition": "The pending incoming attack does not resolve."
    },
    {
      "id": "STRIP_GUARD",
      "operator": "SET",
      "state": "guard",
      "value": "open",
      "definition": "Set the target's guard state to Open; Open is not itself an effect."
    },
    {
      "id": "CHANGE_MEASURE",
      "operator": "SET",
      "state": "measure",
      "definition": "Change measure in an explicit direction with an explicit required prior value."
    },
    {
      "id": "FORCE_MOVEMENT",
      "status": "RESERVED_SECOND_WAVE",
      "definition": "Move a fighter in physical space under a future defined movement/engagement procedure.",
      "current_vertical_slice_required": false
    },
    {
      "id": "MODIFY_RESPONSE_TREE",
      "operators": ["RESTRICT_RESPONSE", "REPLACE_PENDING_ATTACK"],
      "status": "EXCEPTIONAL_RED_FLAG",
      "definition": "Remove, narrow, bypass, replace, or exceptionally reorder a normal response structure; requires explicit justification and later incentive audit."
    }
  ],
  "attack_parameter_vocabulary": {
    "accuracy": ["normal", "boon", "bane"],
